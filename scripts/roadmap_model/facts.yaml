# TZBOT WCM-500-24 receiver (manual V2.5: 170 x 150 x 52 mm, about 1.5 kg). Owner correction A1 as corrected on 2 Nov 2026 (owner; to be
# entered in P-03 and M-01; register CHARGING): wireless charging prepared in 2.0, the receiver unit is installed later (manual charging through SB50 at any time); 170 mm along the
# robot (x) x 150 mm across (y), centred on the long axis, as close to the rear panel inner face as possible without touching the rear
# TF-Luna, the rear MB7060s, their mounts or the rear panel flange (rear_layout.py measures them); bottom 2 mm below the base-sheet
# underside (50 mm above the floor). No 240 x 210 mm zone (withdrawn). No transmitter is drawn.
tzbot_receiver: {model: WCM-500-24, source: "TZBOT WCM-500-24 Wireless Charger Instruction Manual V2.5 (2021-09-23)", size: [0.170, 0.150, 0.052], mass: 1.5, touch_clear: 0.001,
                 status: "prepared, installed later", below_base_sheet: 0.002, air_gap: [0.010, 0.030], air_gap_nominal: 0.020,
                 align: [0.020, 0.020], metal_clear: 0.020, metal_clear_above: 0.015,   # owner decision 8 Nov 2026: no metal within 20 mm of the receiver sides (manual V2.5 Figure 4, A >= 2 cm), held by a plastic frame on the steel deck; 15 mm above (owner, TZBOT recommends 20 mm)
                 frame: {width: 0.020, material: "3D-printed plastic (first iteration)", design: "mechanical owner, D-02 and D-03", fixing: "screws to the base sheet; receiver screwed or clipped into the frame"},
                 
                 freq_khz: [30, 60], data_link_ghz: [2.400, 2.485], data_link_dbm: 0, output_v: [12, 30], output_a: [8, 15], efficiency_min: 0.85,
                 signals: {brown: "start, active high, 3 to 30 V DC", yellow: "fault, active low, open collector, max 200 mA, 30 V DC", blue: "signal ground",
                           red: "receiver output to battery +", black: "receiver output to battery -"}}
