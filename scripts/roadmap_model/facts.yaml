          hold: "exact carrier SKU, fit and power to confirm"}
# D-11 (P-03 rev20.5 item 29): CTL-017 is the single upper-body controller on CAN3 (CANopen 500 kbit/s, node 0x10); board proposed
# (the electrical owner checks): NUCLEO-G474RE + BLDC-SHIELD_IFX007T + SN65HVD230. Stop sensors SICK IME12-04BNSZC0S are NPN NO, 10 to 30 V.
upperbody_controller: {id: CTL-017, bus: CAN3, node: "0x10", bitrate_kbit: 500, board: "NUCLEO-G474RE + BLDC-SHIELD_IFX007T + SN65HVD230 (proposed, the electrical owner checks)",
                       scope: "lift H-bridge and Halls, three stop sensors, light bar, ZX80 power and charge enable, spare inputs (functional only)",
                       stop_sensor_output: "NPN NO, 10 to 30 V (pull-up to 24 V on CTL-017)", decision: D-11}
