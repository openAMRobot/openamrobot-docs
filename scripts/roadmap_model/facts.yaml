                             # compression under load and levels the rigid chassis (no suspension); wheel-to-floor overlap <= 2 mm is an intended contact
track: 0.400                 # placeholder; 0.46 measured on the legacy robot
chassis: [0.780, 0.582]
base_sheet: {bottom: 0.052, top: 0.054}
deck: 0.294
cover_underside: 0.290      # deck 0.054 + 236 mm (B5)
# slot between the base panels and the cover skirt (CAD v0.2 base GLB: side, front and rear panel tops z 0.2142 to 0.2150, cover lower edge z 0.2321):
# the LiDAR looks out through it; owner rule 8 Nov 2026 (P-03 rev20.5 item 29): no cable and no tie in the slot band, all around the robot, no inward band
cover_slot: {panel_top: 0.2142, cover_edge: 0.2321, margin: 0.003, depth: 0.005}   # owner rule 8 Nov 2026 (P-03 rev20.5 item 29): the band at the panels, no 50 mm inward band
# lift base plate MEC-019, owner decision 2 Nov 2026 (B3): one 10 mm 6082-T6 plate on the centre-frame arch top (z 0.294), bolted from above
# into the inner arch pattern (CAD MMP.04.00.00.000: 4 x M8 at x +/-0.060, y +/-0.050). Decision D-20 (8 Nov 2026, approved, rule
# "most COTS, fewest operations, fewest custom parts"): the column foot is fixed from above through its four mounting-tab holes
# (260 x 30 mm, counterbores on the foot top face, seat 4.5 mm) with 4 x DIN 7984 M8 x 14 8.8, no washer, medium threadlocker, into
# M8 tapped through MEC-019 (9.5 mm engagement, no inserts). MEC-019 is 350 x 140 mm (10 mm longer at each end than 330 mm, so the
# tab holes keep 20 mm edge distance). The 224 x 40 mm pattern is DOLD-internal (opens on the foot underside). Machining is released
# only after the DOLD drawing and a dry fit (mechanical owner).
lift_plate: {size: [0.350, 0.140, 0.010], x: [-0.090, 0.260], top: 0.304, arch_bolts: {x: [-0.060, 0.060], y: [-0.050, 0.050]},
             arch_outer: {x: [-0.095, 0.095], y: [-0.150, 0.150]}, col_axis_x: {bp000: 0.060, bp050: 0.110}, col_screws: [0.260, 0.030],
             col_fixing: {screw: "DIN 7984 M8 x 14 8.8", qty: 4, from: above, into: "M8 tapped through MEC-019", engagement: 0.0095, washer: none,
                          threadlocker: medium, decision: D-20, status: "approved; machining after the DOLD drawing and a dry fit (mechanical owner)"}}
arch: {top: 0.294, sheet: 0.002, walls_x: [-0.117, 0.117], ribs_y: [-0.077, 0.077], material: "S235JR (EN 1.0114), 2 mm"}
# GI-082 fix decided by the owner on 8 Nov 2026: 4 x M8 8.8 through-bolts and a backing plate under the arch top sheet. Decision D-21 (8 Nov 2026,
# approved with the D-20 rule): one laser-cut tapped steel plate if the mechanical owner confirms the space, otherwise 5 mm S235 with press-in (PEM) nuts.
# The screening below uses 5 mm S235; size about 150 x 130 mm until the drawing (with the two 50 x 24 mm lift cable openings).
arch_fix: {kind: through-bolts with backing plate, bolts: M8 8.8, backing_t: 0.005, backing_material: S235JR, backing_size: [0.150, 0.130],
           backing_options: "tapped plate or 5 mm S235 with press-in nuts, the mechanical owner confirms", decision: D-21, status: "approved rule, drawing pending (mechanical owner)"}
column: {section: [0.240, 0.060], retracted: 0.530, stroke: 0.350, mass: 11.7,
         # DOLD supplier CAD Hexalift_EB530_Hub350_mit_Montagelaschen.STEP (owner, 8 Nov 2026; OCC bounding boxes, column frame: z from the column base)
         foot: [0.280, 0.0604, 0.010], static_bottom: 0.010, static_profile_top: 0.503, static_top: 0.505,
         inner: [0.2095, 0.0533, 0.470], inner_bottom_retracted: 0.060,
         foot_screws: {x: 0.112, y: 0.020, role: "DOLD-internal (224 x 40 mm, underside counterbores), not the robot fixing"},
         tab_holes: {x: 0.130, y: 0.015, seat: 0.0045, role: "robot fixing (260 x 30 mm, top-face counterbores), D-20"},
         step: "Hexalift_EB530_Hub350_mit_Montagelaschen.STEP (DOLD, 2019-01-28)",
         # 11.7 kg catalogue split into the static and the moving share (8 Nov 2026), from the STEP boxes above and the materials:
         # z_col = centre of mass height in the column frame at the retracted stop; the drive takes the rest of the catalogue mass
         mass_split: {
           static: [{part: "outer profile 240 x 60, 0.6 m perimeter x 3 mm wall x 0.493 m, aluminium", kg: 2.40, z_col: 0.257},
                    {part: "foot with mounting tabs 280 x 60 x 10 mm, steel", kg: 1.33, z_col: 0.005},
                    {part: "motor, gearbox, spindle and control in the foot (catalogue rest)", kg: 5.16, z_col: 0.100}],
           moving: [{part: "inner profile 209.5 x 53.3, 0.526 m perimeter x 3 mm wall x 0.47 m, aluminium", kg: 2.00, z_col: 0.295},
                    {part: "top cap 240 x 60 x 8 mm, aluminium", kg: 0.31, z_col: 0.530},
                    {part: "push tube D20 x 2 x 450 mm steel with the spindle nut", kg: 0.50, z_col: 0.300}]}}
