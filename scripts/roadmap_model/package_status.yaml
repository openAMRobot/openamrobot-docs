# Package badges and their evidence (architecture page cards), read by packages.py.
# Judgement lives here; facts (paths, heads, rc.1 pins, duplicates) are generated.
# Rule (packages.py and check_roadmap.py): MERGED AND TESTED names a check, its run (https link), the tested commit and
# the profile. Without a readable run the badge is MERGED UNTESTED and the note says why. A run on the v0.0.1 rig or on
# 2.0 hardware is a separate record and never sets these badges.
packages:
  openamrobot_bringup:
    area: base_nav
    status: MERGED UNTESTED
    evidence: {check: drivers-bringup-tests (launch description), run: "https://github.com/openAMRobot/openamr-platform-sw/actions/runs/42646529868", commit: f71f9f1, profile: launch test without hardware}
    prs: [129]
    note: Launch for simulation and the v0.0.1 rig; the 2.0 launch waits for the STM32 host bridge.
  openamrobot_description:
    area: base_nav
    status: MERGED AND TESTED
    evidence: {check: description-tests, run: "https://github.com/openAMRobot/openamr-platform-sw/actions/runs/42801418387", commit: 713574f, profile: xacro and URDF checks}
    prs: []
    note: Base masses from the reviewed mass export (#126, 10 Nov).
  openamrobot_docking:
    area: docking
    status: MERGED UNTESTED
    evidence: {}
    prs: [125]
    note: "Sequencer merged; no launch on main starts the docking server, so docking runs end to end only after #125. Not tested on a robot."
  openamrobot_drivers:
    area: base_nav
    status: MERGED UNTESTED
    evidence: {check: drivers-bringup-tests, run: "https://github.com/openAMRobot/openamr-platform-sw/actions/runs/42646529868", commit: f71f9f1, profile: launch test without hardware}
    prs: [132]
    note: Teensy micro-ROS agent and RPLIDAR for the v0.0.1 rig; the 2.0 STM32 host bridge is not started (#132 is a proposal).
  openamrobot_gazebo:
    area: sim
    status: MERGED UNTESTED
    evidence: {}
    prs: []
    note: "Gazebo Harmonic worlds and bridge; odometry results are unreliable until the physics fault in openamr-upperbody-sw #49 is fixed."
  openamrobot_nav2:
    area: base_nav
    status: MERGED AND TESTED
    evidence: {check: nav-status-tests, run: "https://github.com/openAMRobot/openamr-platform-sw/actions/runs/42646530011", commit: f71f9f1, profile: unit and launch tests in simulation}
    prs: [90, 91, 92, 113]
    note: Map persistence (#114) and map saving (#115) merged 9 Nov; one arbitrated command path with a stop gate in review (#90).
  openamrobot_perception:
    area: base_nav
    status: MERGED UNTESTED
    evidence: {}
    prs: [53]
    note: Per-sector LiDAR body filter on main; base RGB-D camera simulation in review (#53).
  openamrobot_upperbody_bringup:
    area: upper
    status: MERGED AND TESTED
    evidence: {check: Model tests a6 (static+mock), run: "https://github.com/openAMRobot/openamr-upperbody-sw/actions/runs/42408877792/job/128512477486", commit: 2ca7392, profile: static and mock (GenericSystem)}
    prs: [48]
    note: Gazebo A7 was skipped on this head (it runs on demand).
  openamrobot_upperbody_control:
    area: upper
    status: MERGED AND TESTED
    evidence: {check: Model tests a6 (static+mock), run: "https://github.com/openAMRobot/openamr-upperbody-sw/actions/runs/42408877792/job/128512477486", commit: 2ca7392, profile: static and mock (GenericSystem)}
    prs: [53]
    note: No hardware interface for the lift or the arms; physical lift authority belongs to CTL-017.
  openamrobot_upperbody_description:
    area: upper
    status: MERGED AND TESTED
    evidence: {check: Model tests a6 (static+mock), run: "https://github.com/openAMRobot/openamr-upperbody-sw/actions/runs/42408877792/job/128512477486", commit: 2ca7392, profile: static and mock (GenericSystem)}
    prs: [48]
    note: Mass re-pin in review (#48, Gazebo A7 red at L1000).
  openamrobot_upperbody_gazebo:
    area: upper
    status: MERGED AND TESTED
    evidence: {check: Model tests a6 (static+mock), run: "https://github.com/openAMRobot/openamr-upperbody-sw/actions/runs/42408877792/job/128512477486", commit: 2ca7392, profile: static and mock; Gazebo A7 not run on this head}
    prs: [48]
    note: Launch, worlds and models on main; the Gazebo profile (A7) runs on demand.
  openamrobot_upperbody_moveit:
    area: upper
    status: MERGED AND TESTED
    evidence: {check: Model tests a6 (static+mock), run: "https://github.com/openAMRobot/openamr-upperbody-sw/actions/runs/42408877792/job/128512477486", commit: 2ca7392, profile: static and mock (GenericSystem)}
    prs: []
    note: MoveIt 2 plans with the lift as a planned joint.
  openamr_nav_msgs:
    area: interfaces
    status: MERGED UNTESTED
    evidence: {}
    prs: [28, 35]
    note: Was shown as tested; the CI run on interfaces main 14912e1 was not readable in the 10 Nov refresh, so no run is linked. The interfaces lead links the DDS verification run to restore the badge.
  openamr_ui_msgs:
    area: interfaces
    provider: openamrobot-ui
    status: MERGED UNTESTED
    evidence: {}
    prs: []
    note: Two repositories provide this package (ui and interfaces, OA-08); one provider is chosen before a clean full-stack install is claimed.
  interface_install_consumer:
    area: interfaces
    status: MERGED UNTESTED
    evidence: {}
    prs: []
    note: Test consumer, not a product package. Was shown as tested; the CI run on interfaces main was not readable in the 10 Nov refresh.
  openarm_v2_fake_baseline:
    area: upper
    status: MERGED UNTESTED
    evidence: {}
    prs: []
    note: Development fixture with fake hardware, not a device package. Was shown as tested; manipulation main be76d30 runs only Repository quality.
  openamr_ui_bringup:
    area: ui
    status: MERGED UNTESTED
    evidence: {}
    prs: [56, 60]
    note: "rc.1 items on integration branch #56; Stop also cancels navigate_through_poses in #60. The software Stop is not the E-stop."
  openamr_ui_package:
    area: ui
    status: MERGED UNTESTED
    evidence: {}
    prs: [56, 60]
    note: UI CI on main 0ca798b was not readable in the 10 Nov refresh.
