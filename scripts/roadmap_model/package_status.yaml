# Package badges and their evidence (architecture page cards), read by packages.py.
# Judgement lives here; facts (paths, heads, rc.1 pins, duplicates) are generated.
# Rule (packages.py and check_roadmap.py): MERGED AND TESTED names a check, its run (https link), the tested commit, the
# profile and the conclusion (success), and the package tree at the tested commit equals the displayed head (generated). Without a readable run the badge is MERGED UNTESTED and the note says why. A run on the v0.0.1 rig or on
# 2.0 hardware is a separate record and never sets these badges.
packages:
  openamrobot_bringup:
    area: base_nav
    status: MERGED UNTESTED
    evidence: {check: drivers-bringup-tests (launch description), run: "https://github.com/openAMRobot/openamr-platform-sw/actions/runs/42646529868", commit: f71f9f1, profile: launch test without hardware, conclusion: success}
    prs: [129]
    note: Launch for simulation and the v0.0.1 rig; the 2.0 launch waits for the STM32 host bridge.
  openamrobot_description:
    area: base_nav
    status: MERGED AND TESTED
    evidence: {check: description-tests, run: "https://github.com/openAMRobot/openamr-platform-sw/actions/runs/42801418387", commit: 713574f, profile: xacro and URDF checks, conclusion: success}
    prs: []
    note: Base masses from the reviewed mass export (#126, 10 Nov).
  openamrobot_docking:
    area: docking
    status: MERGED UNTESTED
    evidence: {}
    prs: [125]
    note: "Sequencer merged; no launch on main starts the docking server, so docking runs end to end only after #125. Not tested on a robot."
  openamrobot_drivers:
