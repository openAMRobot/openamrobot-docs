# URDF link to roadmap part map (convergence phase 1, warn only).
#
# Goal: the roadmap becomes a renderer of the expanded combined_robot.xacro (openamr-upperbody-sw) at a pinned commit, with
# no hand-typed dimensions in model.js. One geometry, two presentations. URDF only: physics, inertials, collisions,
# ros2_control, MoveIt, Gazebo. Roadmap only: finishes, labels, exploded offsets, BOM classes, harness, fasteners and
# design-intent parts; a roadmap-only part always attaches to a URDF link with an offset.
#
# mapped: one entry per compared item.
#   urdf:    URDF link names (a list is compared as the union of their visuals); "link#i" selects the i-th visual
#   roadmap: roadmap part ids as the pages build them (model.js / placement.json); "part#i" selects the i-th part group
#   mode:    aabb  - world box of the visuals (centre = pose, extents = primitive size), tolerance 0.5 mm
#            frame - link frame origin and orientation (OpenArm links, meshes upstream), tolerance 0.5 mm and 0.2 deg
#   pending: an intended difference of the 2 Nov 2026 owner decisions that the combined model takes later (reason)
# urdf_only: URDF links with a visual that the roadmap does not draw (reason).
# roadmap_only: every roadmap part without a URDF visual, with the URDF link it attaches to (written by
#   parity.py --sync-roadmap-only from the page scene; the offset is the part's box centre in that link's frame).
mapped:
  - {urdf: ["base_link#0"], mode: aabb, note: "base_chassis.stl: CAD v0.2 sheet metal and printed mounts",
     roadmap: [front_panel, rear_panel, side_panel_left, side_panel_right, base_plate, centre_bracket, electronics_bracket,
               support_front_left, support_front_right, support_rear_left, support_rear_right, lidar_support, lidar_spacer,
               camera_mount, ultrasonic_mount_front_left, ultrasonic_mount_front_right, ultrasonic_mount_rear_left,
               ultrasonic_mount_rear_right, tof_mount_front, tof_mount_rear, driver_mount, controller_plate]}
  - {urdf: ["base_link#1"], mode: aabb, note: "base_covers.stl", roadmap: [cover, cover_flange_front, cover_flange_rear]}
  - {urdf: ["base_link#2"], mode: aabb, note: "base_equipment.stl: component envelopes",
     roadmap: [motor_driver, compute, base_controller, battery, estop, reset_button],
     pending: "C1 (2 Nov 2026, proposed): front bay option A moves the Jetson Orin NX (now 8 GB on Robotics 104, D-01) off the IMU bracket to the upper shelf; base_equipment.stl keeps the CAD v0.2 position"}
  - {urdf: [fl_caster_link], roadmap: [castor_front_left], mode: aabb}
  - {urdf: [fr_caster_link], roadmap: [castor_front_right], mode: aabb}
  - {urdf: [bl_caster_link], roadmap: [castor_rear_left], mode: aabb}
  - {urdf: [br_caster_link], roadmap: [castor_rear_right], mode: aabb}
  - {urdf: [left_wheel_link], roadmap: [hub_motor_wheel_left], mode: aabb}
  - {urdf: [right_wheel_link], roadmap: [hub_motor_wheel_right], mode: aabb}
  - {urdf: [lidar_link], roadmap: [lidar], mode: aabb}
  - {urdf: [base_camera_link], roadmap: [base_camera], mode: aabb}
  - {urdf: [imu_link], roadmap: [imu], mode: aabb}
  - {urdf: [us_front_left], roadmap: [ultrasonic_front_left], mode: aabb}
  - {urdf: [us_front_right], roadmap: [ultrasonic_front_right], mode: aabb}
  - {urdf: [us_rear_left], roadmap: [ultrasonic_rear_left], mode: aabb}
  - {urdf: [us_rear_right], roadmap: [ultrasonic_rear_right], mode: aabb}
  - {urdf: [tof_front], roadmap: [tof_front], mode: aabb}
  - {urdf: [tof_rear], roadmap: [tof_rear], mode: aabb}
  - {urdf: [lift_column_base_link], roadmap: ["lift_column#0"], mode: aabb, note: "static DOLD profile"}
  - {urdf: [lift_carriage_link], roadmap: ["lift_column#1"], mode: aabb, note: "moving inner stage and head plate"}
  - {urdf: [adapter_plate_link], roadmap: [adapter_plate], mode: aabb,
     pending: "A6 (owner, 2 Nov 2026): one-piece adapter plate with a 65 mm rear extension behind the column rear face (425 x 100 x 10 mm) that carries the flag rod; the combined model keeps the plate flush with the column rear face (P-03 rev20.1 item 25 D2) until the P-03 and M-01 entry"}
  - {urdf: [arm_profile_link], roadmap: [arm_profile], mode: aabb, note: "MISUMI HFS6-60120 arm post"}
  - {urdf: [head_camera_bracket_link], roadmap: [head_camera_bracket], mode: aabb}
  - {urdf: [head_camera_link], roadmap: [head_camera], mode: aabb, rot: true, note: "ZED Mini at hp30",
     pending: "owner 8 Nov 2026: lens 60 mm ahead of J1_A (P-03 rev20.4; combined model follows in openamr-upperbody-sw #48)"}
  - {urdf: [getac_tablet_link], roadmap: [getac_tablet], mode: aabb,
     pending: "A3 (owner, 2 Nov 2026): Getac portrait, centre 40 mm lower, fixed mount (combined model has the superseded landscape tablet until the P-03 entry)"}
  - {urdf: [head_light_link], roadmap: [head_light], mode: aabb,
     pending: "A3 (owner, 2 Nov 2026): light bar top 10 mm below the Getac bottom (combined model 30 mm below the superseded landscape tablet)"}
  - {urdf: [second_estop_link], roadmap: [second_estop], mode: aabb,
     pending: "A5 (owner, 2 Nov 2026): the roadmap draws the second E-stop on the adapter plate behind the post, button up; the combined model keeps the static-column datum until the P-03 and M-01 entry"}
  - {urdf: [lift_stop_sensor_l1000_link, lift_stop_sensor_l1175_link, lift_stop_sensor_l1350_link],
     roadmap: [lift_stop_sensors, lift_sensor_brackets], mode: aabb, note: "three SICK IME12 with BEF-WN-M12 brackets, one roadmap group each",
     pending: "A6 (owner, 2 Nov 2026): sensors on the rear face of the static column, centred in y, sensing faces toward +y; the combined model keeps the side face until the P-03 and M-01 entry"}
  - {urdf: [lift_flag_rod_link], roadmap: [flag_rod], mode: aabb,
     pending: "A6 (owner, 2 Nov 2026): rod behind the column under the adapter-plate rear extension; the combined model keeps the side-face position until the P-03 and M-01 entry"}
  - {urdf: [lift_flag_link], roadmap: [lift_flag], mode: aabb,
     pending: "A6 (owner, 2 Nov 2026): flag on the rod behind the column, 2 mm off the rear-face sensors (part of the rod position)"}
  # OpenArm 2.0 (upstream meshes): link frames at all joints 0
  - {urdf: [openarm_left_base_link], roadmap: ["openarm_left:base"], mode: frame}
  - {urdf: [openarm_left_link1], roadmap: ["openarm_left:link1"], mode: frame}
