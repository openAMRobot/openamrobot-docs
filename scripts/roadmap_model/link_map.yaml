  - {urdf: [openarm_left_ee_base_link], roadmap: ["openarm_left:link7"], mode: frame}
  - {urdf: [openarm_left_ee_link1], roadmap: ["openarm_left:finger1"], mode: frame}
  - {urdf: [openarm_left_ee_link2], roadmap: ["openarm_left:finger2"], mode: frame}
  - {urdf: [openarm_right_base_link], roadmap: ["openarm_right:base"], mode: frame}
  - {urdf: [openarm_right_link1], roadmap: ["openarm_right:link1"], mode: frame}
  - {urdf: [openarm_right_link2], roadmap: ["openarm_right:link2"], mode: frame}
  - {urdf: [openarm_right_link3], roadmap: ["openarm_right:link3"], mode: frame}
  - {urdf: [openarm_right_link4], roadmap: ["openarm_right:link4"], mode: frame}
  - {urdf: [openarm_right_link5], roadmap: ["openarm_right:link5"], mode: frame}
  - {urdf: [openarm_right_link6], roadmap: ["openarm_right:link6"], mode: frame}
  - {urdf: [openarm_right_ee_base_link], roadmap: ["openarm_right:link7"], mode: frame}
  - {urdf: [openarm_right_ee_link1], roadmap: ["openarm_right:finger1"], mode: frame}
  - {urdf: [openarm_right_ee_link2], roadmap: ["openarm_right:finger2"], mode: frame}

