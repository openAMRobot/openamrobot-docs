  - {urdf: [openarm_left_ee_link1], roadmap: ["openarm_left:finger1"], mode: frame}
  - {urdf: [openarm_left_ee_link2], roadmap: ["openarm_left:finger2"], mode: frame}
  - {urdf: [openarm_right_base_link], roadmap: ["openarm_right:base"], mode: frame}
