  camera_link: "legacy 0.04 x 0.08 x 0.04 box at the PLATFORM-PIN 131e500 (removed on platform-sw main by #106); the 2.0 base camera is base_camera_link"
  left_wrist_camera_link: "drawn on robot.html as a page fitting, not a registry part (conflicts: wrist cameras)"
  right_wrist_camera_link: "drawn on robot.html as a page fitting, not a registry part (conflicts: wrist cameras)"

# pending roadmap-only parts of the owner decisions (listed in the parity report with their reason)
pending_roadmap_only:
  lift_base_plate: "B3 (2 Nov 2026, decided): one 10 mm 6082-T6 plate on the centre-frame arch; the combined model has no plate visual (base_plate_top_z only)"
