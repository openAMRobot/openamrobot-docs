name: Documentation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Build documentation strictly
        run: mkdocs build --strict

      - name: Check repository documentation rules
        run: bash scripts/check_docs.sh

      - name: Check the roadmap pages
        run: python3 scripts/check_roadmap.py

      - name: Roadmap checker regression tests
        run: python3 -m unittest discover -s scripts/tests

      - name: Parity check dependencies
        run: pip install numpy==2.1.3 pyyaml==6.0.2

      # Out-of-tolerance items are warnings only (convergence phase 1, parity.py --ci exits 0 on them);
      # a missing dependency or any execution error fails the step.
      - name: Roadmap vs combined model parity (warn only, convergence phase 1)
        run: cd scripts/roadmap_model && python3 parity.py --ci

      - name: Check generated links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir site 'site/**/*.html'
          fail: true

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live custom domain
        run: bash scripts/check_live_site.sh https://docs.openamrobot.ai
