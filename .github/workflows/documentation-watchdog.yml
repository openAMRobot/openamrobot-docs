name: Documentation watchdog

on:
  schedule:
    # Thursday 13:00 UTC. GitHub cron uses UTC and does not adjust for DST.
    - cron: "0 13 * * 4"
  workflow_dispatch:
    inputs:
      since:
        description: "Optional ISO-8601 audit start time (for example 2026-10-01T00:00:00Z)"
        required: false
        type: string
      initial_days:
        description: "Days to inspect if no previous successful watchdog run exists"
        required: false
        default: "7"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: documentation-watchdog
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only source-to-docs audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out documentation repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run read-only audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCHDOG_SINCE: ${{ inputs.since }}
          WATCHDOG_INITIAL_DAYS: ${{ inputs.initial_days || '7' }}
        run: |
          args=(--repo-root . --output-dir "$RUNNER_TEMP/documentation-watchdog")
          if [[ -n "$WATCHDOG_SINCE" ]]; then
            args+=(--since "$WATCHDOG_SINCE")
          fi
          args+=(--initial-days "$WATCHDOG_INITIAL_DAYS")
          python scripts/documentation_watchdog.py "${args[@]}"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-watchdog-${{ github.run_id }}
          path: ${{ runner.temp }}/documentation-watchdog/
          if-no-files-found: warn
          retention-days: 90
