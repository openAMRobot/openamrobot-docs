schema_version: 1
about: 'Roadmap model masses per URDF link, generated by scripts/roadmap_model/mass_export.py from bom_coverage.csv (BOM Issue 7.14 masses), placement.json and the
  analysis roll-up. Input for the platform-sw mass PR (base) and for mass_provenance.yaml (upper body). Frame of com_m in links: the link frame (identity rotations);
  components: base_footprint at bp000.'
snapshot: 2 Nov 2026
groups:
  openarm:
    state: external_nominal
    source: OpenArm 2.0 arms (ARM-001 BOM mass); the combined model keeps the upstream link masses
    owner: upstream openarm_description
    links:
      openarm:
        items:
        - bom: ARM-001
          component: openarm
          mass_kg: 12.26
          com_m:
          - 0.36
          - 0.0
          - 0.75
          size_m:
          - 0
          - 0
          - 0
          source: upstream URDF nominal link masses (2 x 6.13 kg incl. gripper)
        mass_kg: 12.26
        com_m:
        - 0.12
        - -0.031
        - -0.25
        inertia_kgm2:
          ixx: 0.0
          iyy: 0.0
          izz: 0.0
        inertia_note: sum of the component boxes (uniform density) about the link centre of mass, by the parallel-axis theorem; products of inertia not given
        link_origin_m:
        - 0.24
        - 0.031
        - 1.0
  base:
