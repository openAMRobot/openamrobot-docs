title: OpenAMRobot Documentation
description: Central documentation portal for the OpenAMRobot ecosystem

url: "https://docs.openamrobot.ai"
baseurl: ""

repository: openAMRobot/openamrobot-docs

remote_theme: a modern jekyll documentation theme

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links

mdl_colors: indigo-pink
copyright: OpenAMRobot
search: true
menu_style: dropdown

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty

relative_links:
  enabled: true
  collections: true

exclude:
  - Gemfile
  - Gemfile.lock
