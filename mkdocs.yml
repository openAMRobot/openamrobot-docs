      - Contributing: community/contributing.md
      - Documentation Standard: community/documentation-standard.md
      - Get Involved: community/get-involved.md
      - Support: community/support.md
  - About:
      - Overview: about/index.md
      - Legal: about/legal.md
      - The App: about/the-app.md
      - Visual Identity: about/visual-identity.md
  - Contributing:
      - Overview: contributing/index.md
      - Documentation Standard: DOCUMENTATION_STANDARD.md

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/github-organization-link.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search:
      separator: '[\\s\\-_]+'
  - social
  - exclude:
      glob:
        - "templates/*"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/openAMRobot
      name: OpenAMRobot on GitHub
    - icon: fontawesome/solid/globe
      link: https://botshare.ai
      name: Botshare LTD
    - icon: fontawesome/solid/envelope
      link: mailto:info@botshare.ai
      name: Contact OpenAMRobot
  generator: false

use_directory_urls: true
