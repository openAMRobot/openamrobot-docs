site_name: "OpenAMRobot Documentation"
site_description: "The OpenAMRobot knowledge hub: learn, build, operate, customize, and create a business around an open-source Embodied AI platform"
site_url: "https://docs.openamrobot.ai/"
site_author: "Botshare LTD"

# MkDocs Material reads stars and forks from this representative active repository.
# Client-side code redirects the visible source link to the organization homepage.
repo_name: "OpenAMRobot"
repo_url: "https://github.com/openAMRobot/openamr-platform-sw"
edit_uri: "https://github.com/openAMRobot/openamrobot-docs/edit/main/docs/"

docs_dir: docs
copyright: "Copyright © 2021-2026 OpenAMRobot (Botshare LTD) · CC BY 4.0"

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Start Here: start-here/index.md
  - Learn the Platform:
      - Learning Path: learn/index.md
      - Foundations: learn/foundations.md
      - Build: learn/build.md
      - Bring Up: learn/bring-up.md
      - Configure: learn/configure.md
      - Train: learn/train.md
      - Use: learn/use.md
      - Maintain: learn/maintain.md
      - Customize: learn/customize.md
      - Safety: safety/index.md
      - Tutorials: tutorials/index.md
      - Troubleshooting: troubleshooting/index.md
  - Technical Reference:
      - Overview: reference/index.md
      - Architecture: architecture/index.md
      - Repository Map: repositories/index.md
      - Mobile Platform: mobile_base/index.md
      - Operator Interface: ui/index.md
      - Upper Body & Manipulation: upper_body/index.md
      - Interfaces: interfaces/index.md
      - Communication: communication/index.md
  - Solutions:
      - Overview: solutions/index.md
      - Intralogistics: solutions/intralogistics.md
      - Retail & Replenishment: solutions/retail.md
      - Manufacturing: solutions/manufacturing.md
      - Facility & Service Operations: solutions/facility-services.md
      - Education & Research: solutions/education-research.md
      - Pilot Framework: solutions/pilot-framework.md
  - Build a Business:
      - Opportunity: business/index.md
      - Business Models: business/business-models.md
      - Validate Demand: business/validate.md
      - Launch & Deliver: business/launch-deliver.md
      - Partner Program: business/partner-program.md
      - Partner Portal: business/partner-portal.md
  - Academy:
      - Overview: academy/index.md
      - Programs: academy/programs.md
      - Certifications: academy/certifications.md
      - Training Partner Program: academy/partner-program.md
  - Community: community/index.md
  - About:
      - Legal & Contact: about/index.md
      - Visual Identity: about/visual-identity.md
  - Contributing:
      - Overview: contributing/index.md
      - Documentation Standard: DOCUMENTATION_STANDARD.md

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/github-organization-link.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search:
      separator: '[\\s\\-_]+'
  - social
  - exclude:
      glob:
        - "templates/*"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/openAMRobot
      name: OpenAMRobot on GitHub
    - icon: fontawesome/solid/globe
      link: https://botshare.ai
      name: Botshare LTD
    - icon: fontawesome/solid/envelope
      link: mailto:info@botshare.ai
      name: Contact OpenAMRobot
  generator: false

use_directory_urls: true
