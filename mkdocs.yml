site_name: "OpenAMRobot Documentation"
site_description: "Central documentation portal for the OpenAMRobot ecosystem"
site_url: "https://docs.openamrobot.ai/"

repo_name: "openAMRobot/openamrobot-docs"
repo_url: "https://github.com/openAMRobot/openamrobot-docs"

docs_dir: docs

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md

  - Documentation:
      - Getting Started: getting_started/index.md
      - Architecture: architecture/index.md
      - Communication: communication/index.md
      - Interfaces: interfaces/index.md
      - Safety: safety/index.md
      - User Interface: ui/index.md
      - Tutorials: tutorials/index.md
      - Troubleshooting: troubleshooting/index.md
      - Contributing: contributing/index.md

  - Platforms:
      - OpenAMR Platform: openamr_platform/index.md
      - OpenAMH Humanoid: openamh_humanoid/index.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search

use_directory_urls: true
